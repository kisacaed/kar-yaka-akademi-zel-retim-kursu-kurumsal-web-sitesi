<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for Karşıyaka & 2024 -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBC02D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Navy Base -->
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090E1A" />
    </linearGradient>

    <!-- Filter for outline and depth -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Group: Graduation Cap (Top Right of Karşıyaka) -->
  <g transform="translate(365, 30) rotate(-12)" filter="url(#shadow)">
    <!-- Under-cap skull cap -->
    <path d="M 40 50 Q 65 68 90 50 L 86 65 Q 65 80 44 65 Z" fill="#0B132B" stroke="#000000" stroke-width="2" />
    
    <!-- Top Diamond / Mortarboard Plate -->
    <polygon points="65,10 130,42 65,74 0,42" fill="#111827" stroke="#1F2937" stroke-width="2" />
    <!-- Highlight on edge of cap -->
    <polygon points="65,13 124,42 65,71 6,42" fill="#1F2937" />
    
    <!-- Center Button / Rivet -->
    <circle cx="65" cy="42" r="4" fill="#F59E0B" />
    
    <!-- Gold Tassel Hanging to the Right -->
    <path d="M 65 42 Q 105 45 118 68" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <!-- Tassel Ring -->
    <ellipse cx="118" cy="70" rx="3.5" ry="2" fill="#D97706" />
    <!-- Tassel Fringe Brush -->
    <path d="M 115 72 L 121 72 L 124 92 L 112 92 Z" fill="url(#goldGradient)" />
    <!-- Tiny fringe lines -->
    <line x1="114" y1="92" x2="114" y2="95" stroke="#D97706" stroke-width="1.5" />
    <line x1="118" y1="92" x2="118" y2="96" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="122" y1="92" x2="122" y2="95" stroke="#D97706" stroke-width="1.5" />
  </g>

  <!-- Main Brand Block Container -->
  <g id="brand-core">
    <!-- KARŞIYAKA Background Stroke/Silhouette for High Contrast -->
    <text 
      x="270" 
      y="170" 
      text-anchor="middle" 
      font-family="'Outfit', 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="82" 
      letter-spacing="2"
      fill="#0B172E"
      stroke="#070E1E"
      stroke-width="14"
      stroke-linejoin="round"
      stroke-linecap="round"
    >
      KARŞIYAKA
    </text>

    <!-- KARŞIYAKA Primary Yellow/Gold Fill -->
    <text 
      x="270" 
      y="170" 
      text-anchor="middle" 
      font-family="'Outfit', 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="82" 
      letter-spacing="2"
      fill="url(#goldGradient)"
    >
      KARŞIYAKA
    </text>

    <!-- Dark Navy Pill / Block for AKADEMİ -->
    <g transform="translate(60, 185)">
      <!-- Navy Box with subtle border -->
      <rect 
        x="0" 
        y="0" 
        width="420" 
        height="56" 
        rx="8" 
        fill="#0B1B3D" 
        stroke="#1E293B" 
        stroke-width="1.5" 
      />
      
      <!-- AKADEMİ Text in White Bold Spaced -->
      <text 
        x="210" 
        y="40" 
        text-anchor="middle" 
        font-family="'Outfit', 'Inter', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="34" 
        letter-spacing="14" 
        fill="#FFFFFF"
      >
        AKADEMİ
      </text>
    </g>

    <!-- Subtitle: ÖZEL ÖĞRETİM KURSU -->
    <text 
      x="270" 
      y="276" 
      text-anchor="middle" 
      font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
      font-weight="800" 
      font-size="17" 
      letter-spacing="8" 
      fill="#CBD5E1"
    >
      ÖZEL ÖĞRETİM KURSU
    </text>

    <!-- 2024 Year in Gold Script Signature Style -->
    <g transform="translate(195, 290)">
      <!-- Flowing Decorative Loop and 2024 -->
      <path 
        d="M 15 28 C 30 10, 48 8, 42 24 C 38 34, 25 40, 52 38 C 65 37, 75 22, 85 22 C 95 22, 100 36, 115 36 C 125 36, 132 18, 142 38" 
        fill="none" 
        stroke="url(#goldGradient)" 
        stroke-width="2.5" 
        stroke-linecap="round"
        opacity="0.35"
      />
      <text 
        x="75" 
        y="36" 
        text-anchor="middle" 
        font-family="'Brush Script MT', 'Dancing Script', 'Caveat', 'Segoe Script', cursive, sans-serif" 
        font-weight="bold" 
        font-style="italic" 
        font-size="38" 
        fill="url(#goldGradient)"
      >
        2024
      </text>
    </g>
  </g>
</svg>
